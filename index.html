<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christine & Von | Wedding RSVP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <<img src="IMG_1100.png" alt="Christine & Von Monogram">

    <h1>Christine & Von</h1>

    <p class="subtitle">

    <div id="result"></div>

</div>
